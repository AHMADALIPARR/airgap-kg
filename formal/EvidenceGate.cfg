CONSTANTS
  Evidence = {e1, e2}
  Controls = {c1, c2}
  EvidenceFor = [e1 |-> c1, e2 |-> c2]
  EvidenceLabel = [e1 |-> 1, e2 |-> 3]
  ControlLabel = [c1 |-> 1, c2 |-> 3]
  Reader = analyst
  Clearance = [analyst |-> 1]
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoEvidenceConflict
INVARIANT NoUnsupportedVerdict
INVARIANT NoUnapprovedRelease
INVARIANT NoUnauthorizedRelease
INVARIANT NoFalseApproval
CHECK_DEADLOCK FALSE
